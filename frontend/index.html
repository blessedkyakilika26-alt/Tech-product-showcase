<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Product Showcase</title>

    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>

<body>
    <header>
        <h1>Tech Product Showcase</h1>
        <p>Manage your technology products in one place.</p>
    </header>

    <main>
        <section class="form-section">
            <h2 id="form-title">Add a New Product</h2>

            <form id="product-form">
                <div class="form-grid">
                    <div>
                        <label for="product_name">Product Name</label>
                        <input
                            type="text"
                            id="product_name"
                            name="product_name"
                            required
                        >
                    </div>

                    <div>
                        <label for="brand">Brand</label>
                        <input
                            type="text"
                            id="brand"
                            name="brand"
                            required
                        >
                    </div>

                    <div>
                        <label for="category">Category</label>
                        <input
                            type="text"
                            id="category"
                            name="category"
                            required
                        >
                    </div>

                    <div>
                        <label for="price">Price (ZMW)</label>
                        <input
                            type="number"
                            id="price"
                            name="price"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                    <div>
                        <label for="stock_quantity">Stock Quantity</label>
                        <input
                            type="number"
                            id="stock_quantity"
                            name="stock_quantity"
                            min="0"
                            step="1"
                            required
                        >
                    </div>

                    <div>
                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            rows="3"
                        ></textarea>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" id="submit-button">
                        Add Product
                    </button>

                    <button
                        type="button"
                        id="cancel-button"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="products-section">
            <h2>Available Products</h2>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Brand</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="products-table-body">
                        <tr>
                            <td colspan="8">Loading products...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>Tech Product Showcase — ICT 251 CRUD Project</p>
    </footer>
</body>
</html>
